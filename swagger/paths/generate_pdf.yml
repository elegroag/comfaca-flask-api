tags:
  - PDF Oficios
summary: Generar PDF de oficio/afiliación
description: |
  Genera un PDF a partir de una plantilla Jinja2 y un contexto JSON.
  El archivo se guarda en `temp_output/enlinea/`.
  Requiere Basic Auth.
security:
  - basicAuth: []
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      $ref: "#/definitions/GeneratePdfRequest"
responses:
  200:
    description: PDF generado
    schema:
      $ref: "#/definitions/SuccessPdf"
  400:
    description: Validación fallida
    schema:
      $ref: "#/definitions/ErrorResponse"
  401:
    description: No autorizado
  500:
    description: Error interno
    schema:
      $ref: "#/definitions/ErrorResponse"
