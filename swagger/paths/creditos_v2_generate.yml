tags:
  - Creditos V2
summary: Generar PDF de crédito (formato v2)
description: |
  Genera el PDF de solicitud de crédito con plantillas de `templates_creditos_v2/`.
  Mismo contrato JSON que créditos v1 (`solicitud_id` obligatorio).
  No requiere Basic Auth.
  Salida: `temp_output/solicitudes_v2/{solicitud_id}/`.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      $ref: "#/definitions/CreditoPayload"
responses:
  200:
    description: PDF v2 generado
    schema:
      $ref: "#/definitions/SuccessPdf"
  400:
    description: Validación fallida
    schema:
      $ref: "#/definitions/ErrorResponse"
  500:
    description: Error interno
    schema:
      $ref: "#/definitions/ErrorResponse"
